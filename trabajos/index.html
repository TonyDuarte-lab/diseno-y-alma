<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#185fa5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Diseño y Alma - Trabajos</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1f1f1d;--tx2:#5f5e5a;--bd:#e1dfd8;--ac:#185fa5;--acbg:#e6f1fb;--ok:#3b6d11;--okbg:#eaf3de;--wa:#854f0b;--wabg:#faeeda;--rd:#a32d2d;--rdbg:#fcebeb;}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b19;--card:#262624;--tx:#f1efe8;--tx2:#b4b2a9;--bd:#3a3a37;--ac:#85b7eb;--acbg:#0c447c;--ok:#c0dd97;--okbg:#27500a;--wa:#fac775;--wabg:#633806;--rd:#f7c1c1;--rdbg:#791f1f;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(20px,5.8vw,32px);-webkit-text-size-adjust:100%;text-size-adjust:100%;width:100%;touch-action:pan-y}
body{margin:0;width:100%;overflow-x:clip;touch-action:pan-y;background:var(--bg);color:var(--tx);font:1rem/1.45 Arial,Helvetica,sans-serif}
.wrap{width:100%;margin:0 auto;padding:1rem;padding-left:calc(1rem + env(safe-area-inset-left));padding-right:calc(1rem + env(safe-area-inset-right));padding-top:calc(1rem + env(safe-area-inset-top))}
h1{font-size:1.5rem;font-weight:600;margin:0}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:0.75rem;gap:0.25rem}
.tbtn{width:100%;display:flex;justify-content:space-between;border-top:1px solid var(--bd);padding-top:0.25rem}
.card{background:none;border:none;border-bottom:1px solid var(--bd);border-radius:0;padding:0.9rem 0;margin:0}
.nm{font-size:1.25rem}
.card.sel{background:var(--acbg)}
.row{display:flex;justify-content:space-between;align-items:center;gap:0.5rem}
.nm{font-weight:600}
.sub{font-size:1rem;color:var(--tx2)}
.tag{font-size:0.875rem;padding:0.1875rem 0.625rem;border-radius:0.5rem;white-space:nowrap}
.t-sin{background:var(--bd);color:var(--tx2)}.t-plazo{background:var(--okbg);color:var(--ok)}.t-porvencer{background:var(--wabg);color:var(--wa)}.t-demorado{background:var(--rdbg);color:var(--rd)}
.bar{display:none;height:0.375rem;border-radius:0.1875rem;background:var(--bd);margin-top:0.5rem;overflow:hidden}
.bar i{display:block;height:100%}
.f-plazo{background:var(--ok)}.f-porvencer{background:var(--wa)}.f-demorado{background:var(--rd)}.f-sin{background:var(--bd)}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:0.5rem;padding:0.625rem 0.75rem;width:100%}
button{cursor:pointer;font-weight:600}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
@media (prefers-color-scheme:dark){button.pri{color:#04202e}}
button.link{width:auto;border:none;background:none;color:var(--tx2);font-weight:400;padding:0.5rem 0.375rem;font-size:1rem}
.chips{display:flex;gap:0.2rem;flex-wrap:wrap;margin-bottom:0.75rem}
.chip{border:none;background:none;border-bottom:3px solid transparent;border-radius:0;width:auto;padding:0.4rem 0.45rem;font-size:0.78rem;font-weight:400;white-space:nowrap}
.chip.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:700}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet .wrap{padding-bottom:8.75rem}
.back{width:auto;border:none;background:none;font-size:1.125rem;color:var(--ac);padding:0.375rem 0.25rem;font-weight:600}
.steps{margin:0.875rem 0 0.375rem}
.step{display:flex;gap:0.75rem;align-items:flex-start;padding:0.625rem 0.25rem;border-radius:0.625rem;cursor:pointer;position:relative}
.step:active{background:var(--acbg)}
.step svg{flex:none;width:1.875rem;height:1.875rem}
.step .tt{font-size:1.188rem;line-height:1.875rem}
.step.cur .tt{font-weight:700}
.step .meta{font-size:1rem;color:var(--tx2);margin-top:-2px}
.i-done{color:var(--ok)}.i-now{color:var(--ac)}.i-por{color:var(--wa)}.i-late{color:var(--rd)}.i-pend{color:var(--tx2);opacity:.55}
.panel{margin:0.25rem 0 0.5rem 2.5rem;padding:0.625rem;border:1px dashed var(--bd);border-radius:0.625rem}
.pchips{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.5rem}
.pchip{width:auto;padding:0.625rem 1.125rem;border-radius:1.25rem}
.bar-fix{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--bd);padding:0.625rem 1rem calc(0.625rem + env(safe-area-inset-bottom));z-index:11}
.bar-fix .in{margin:0 auto}
button.big{padding:1rem 0.75rem;font-size:1.188rem;border-radius:0.75rem}
button.sec{background:none;border:none;color:var(--tx2);font-weight:400;padding:0.5rem;width:auto}
.toast{position:fixed;left:50%;bottom:7.5rem;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:0.75rem 1.125rem;border-radius:1.25rem;font-size:1rem;z-index:20;max-width:90%}
details summary{cursor:pointer;color:var(--tx2);font-size:1.062rem;padding:0.375rem 0}
.err{color:var(--rd);font-size:0.875rem;margin-top:0.5rem;min-height:1.25rem}
label{font-size:1rem;color:var(--tx2);display:block;margin:0.625rem 0 0.25rem}
.hide{display:none!important}
#app{padding-bottom:6rem}
.mic{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom));z-index:9;width:auto;border-radius:2rem;padding:0.9rem 1.3rem;font-size:1rem;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.mic.rec{background:var(--rd);border-color:var(--rd);color:#fff}
.vopt{text-align:left}
.vsay{font-style:italic;color:var(--tx2);margin:0.3rem 0 0.6rem}
.vres{font-size:1.15rem;font-weight:700;margin:0.5rem 0}
.net{background:var(--wabg);color:var(--wa);font-size:0.9375rem;padding:0.5rem 0.75rem;border-radius:0.625rem;margin-bottom:0.625rem;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--bg);width:100%;border-radius:1rem 1rem 0 0;padding:1.25rem 1rem calc(1.25rem + env(safe-area-inset-bottom))}
.modal button{margin-top:0.625rem}
</style>
</head>
<body>
<div class="wrap">
<div id="login" class="hide">
  <img src="logo-96.png" alt="Diseño y Alma" width="72" height="72" style="border-radius:1rem;display:block;margin-bottom:0.5rem">
  <h1>Diseño y Alma</h1>
  <p class="sub">Ingresá la clave para ver los trabajos.</p>
  <input id="pw" type="password" placeholder="Clave" autocomplete="current-password">
  <div style="height:0.625rem"></div>
  <button class="pri" id="go">Entrar</button>
  <div class="err" id="lerr"></div>
</div>

<div id="app" class="hide">
  <div class="top"><div class="row" style="justify-content:flex-start"><img src="logo-96.png" alt="" width="36" height="36" style="border-radius:0.5rem"><h1>Trabajos</h1></div><div class="tbtn"><button class="link" id="who">👤</button><button class="link" id="ref">Actualizar</button><button class="link" id="out">Salir</button></div></div>
  <div id="net" class="net hide"></div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <div class="sub" style="text-align:center;margin-top:0.5rem" id="upd"></div>
</div>
</div>
<div id="sheet" class="sheet hide"></div>
<button id="mic" class="pri mic hide">🎤 Hablar</button>
<div id="voiceBox" class="modal hide"><div class="box" id="voiceIn"></div></div>
<div id="toast" class="toast hide"></div>
<div id="whoBox" class="modal hide"><div class="box"><h1>¿Quién sos?</h1><p class="sub">Así queda anotado en el historial quién hizo cada cambio.</p><button class="pri big" data-w="Tony">Tony</button><button class="big" data-w="Leo">Leo</button><button class="big" data-w="Otro">Otro</button></div></div>

<script>
var PW = null, DATA = null, FILTER = 'todos', SEL = null, BUSY = false, OFFLINE = false, DATA_AT = 0;
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var API = 'https://script.google.com/macros/s/AKfycbwYpCU2lYRbm9Mq5fC9nO1_VX4zbjNfzE9gpa5spVY31L10GXhmkrm7ZNmpcEhlHtq2GA/exec';
function call(fn){
  var args = Array.prototype.slice.call(arguments,1);
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),credentials:'omit',redirect:'follow'})
    .then(function(r){return r.json();})
    .then(function(j){ if(j.error) throw new Error(j.error); return j.data; });
}
function savedPw(){try{return localStorage.getItem('dya_pw');}catch(e){return null;}}
function savedData(){try{var j=JSON.parse(localStorage.getItem('dya_data')||'null'); return (j&&j.d&&j.d.trabajos)?j:null;}catch(e){return null;}}
function saveData(){try{localStorage.setItem('dya_data',JSON.stringify({d:DATA,t:DATA_AT}));}catch(e){}}
function clearData(){try{localStorage.removeItem('dya_data');}catch(e){}}
function getWho(){try{return localStorage.getItem('dya_who')||'';}catch(e){return '';}}
function setWho(w){try{localStorage.setItem('dya_who',w);}catch(e){}}
function ago(ms){var m=Math.round((Date.now()-ms)/60000); if(m<1) return 'recién'; if(m<60) return 'hace '+m+' min'; var h=Math.round(m/60); if(h<24) return 'hace '+h+' h'; return 'hace '+Math.round(h/24)+' d';}
function netBanner(){var n=$('net'); if(OFFLINE){ n.textContent='Sin conexión · mostrando datos de '+ago(DATA_AT)+'. Los cambios no se guardan hasta que vuelva internet.'; n.className='net'; } else { n.className='net hide'; }}
function isNetErr(e){ return e && (e.name==='TypeError' || /Failed to fetch|NetworkError|Load failed/i.test(e.message||'')); }
function setData(d){ DATA=d; DATA_AT=Date.now(); OFFLINE=false; saveData(); }
function savePw(p){try{localStorage.setItem('dya_pw',p);}catch(e){}}
function clearPw(){try{localStorage.removeItem('dya_pw');}catch(e){}}

function showLogin(msg){ $('app').className='hide'; $('login').className=''; $('lerr').textContent=msg||''; }
function tryLogin(p){
  return call('getData',p).then(function(d){ PW=p; savePw(p); setData(d); $('login').className='hide'; $('app').className=''; render(); })
  .catch(function(e){ if(isNetErr(e)){ $('lerr').textContent='Sin conexión. Probá de nuevo cuando tengas internet.'; return; } clearPw(); clearData(); showLogin((e && e.message || 'No se pudo entrar.').replace(/^Error: /,'')); });
}
$('go').onclick=function(){ var p=$('pw').value; if(!p){$('lerr').textContent='Ingresá la clave.';return;} $('lerr').textContent=''; tryLogin(p); };
$('pw').onkeydown=function(e){ if(e.key==='Enter') $('go').click(); };
$('out').onclick=function(){ clearPw(); clearData(); PW=null; DATA=null; SEL=null; $('sheet').className='sheet hide'; showLogin(''); };
$('ref').onclick=function(){ reload(true); };
$('who').onclick=function(){ askWho(); };
Array.prototype.forEach.call(document.querySelectorAll('#whoBox [data-w]'),function(b){ b.onclick=function(){ setWho(b.getAttribute('data-w')); $('whoBox').className='modal hide'; showWho(); if(WHO_CB){ var f=WHO_CB; WHO_CB=null; f(); } }; });
var WHO_CB=null;
function askWho(cb){ WHO_CB=cb||null; $('whoBox').className='modal'; }
function showWho(){ var w=getWho(); $('who').textContent='👤 '+(w||'¿Quién?'); }
window.addEventListener('online',function(){ reload(); });
window.addEventListener('offline',function(){ OFFLINE=true; netBanner(); });

function reload(force){
  if(!PW) return;
  if(force) $('upd').textContent='Actualizando...';
  call('getData',PW,!!force).then(function(d){ setData(d); render(); }).catch(function(e){ if(isNetErr(e)){ OFFLINE=true; netBanner(); } else if(force){ $('upd').textContent='No se pudo actualizar.'; } });
}

var ORDER={demorado:0,porvencer:1,plazo:2,sin:3};
function render(){
  var T = DATA.trabajos.slice().sort(function(a,b){ return (ORDER[a.estado]-ORDER[b.estado]) || (b.dias||0)-(a.dias||0); });
  var counts={todos:T.length,demorado:0,porvencer:0,sin:0};
  T.forEach(function(t){ if(counts[t.estado]!==undefined) counts[t.estado]++; });
  var defs=[['todos','Todos'],['demorado','Demorados'],['porvencer','Por vencer'],['sin','Sin etapa']];
  $('chips').innerHTML = defs.map(function(d){ return '<button class="chip'+(FILTER===d[0]?' on':'')+'" data-f="'+d[0]+'">'+d[1]+' '+(counts[d[0]]||0)+'</button>'; }).join('');
  Array.prototype.forEach.call($('chips').children,function(b){ b.onclick=function(){ FILTER=b.getAttribute('data-f'); render(); }; });
  var L = T.filter(function(t){ return FILTER==='todos' || t.estado===FILTER; });
  var n = DATA.etapas.length;
  $('list').innerHTML = L.map(function(t){
    var tag = t.estado==='demorado' ? 'Demorado' : t.estado==='porvencer' ? 'Por vencer' : t.estado==='sin' ? 'Sin etapa' : 'En plazo';
    var et = t.etapa>=0 ? DATA.etapas[t.etapa].nombre : 'Etapa por asignar';
    var pc = t.etapa>=0 ? Math.round((t.etapa+1)/n*100) : 0;
    var info = t.etapa>=0 ? 'Paso '+(t.etapa+1)+' de '+n+(t.dias!=null ? ' · '+t.dias+' d'+(t.est!=null?' de '+t.est:'') : '') : '';
    return '<div class="card'+(SEL===t.id?' sel':'')+'" data-id="'+esc(t.id)+'"><div class="row"><span class="nm">'+esc(t.cliente)+'</span><span class="tag t-'+t.estado+'">'+tag+'</span></div>'
      +'<div class="sub">'+esc(et)+(t.responsable?' · '+esc(t.responsable):'')+(t.zona?' · '+esc(t.zona):'')+'</div>'
      +(t.etapa>=0?'<div class="row sub" style="margin-top:0.25rem"><span>'+info+'</span><span></span></div>':'')
      +'<div class="bar"><i class="f-'+t.estado+'" style="width:'+pc+'%"></i></div></div>';
  }).join('') || '<div class="sub">No hay trabajos para mostrar.</div>';
  Array.prototype.forEach.call($('list').querySelectorAll('.card'),function(c){ c.onclick=function(){ openSheet(c.getAttribute('data-id')); }; });
  renderDetail();
  var now=new Date(DATA_AT||Date.now()); $('upd').textContent='Actualizado '+now.getHours()+':'+('0'+now.getMinutes()).slice(-2);
  netBanner(); showWho(); $('upd').textContent+=' · v'+VERSION; $('mic').className='pri mic'+(REC?' rec':''); $('mic').textContent=REC?'⏺ Escuchando…':'🎤 Hablar';
}

var OPEN_PANEL = null;
function toast(msg){ var t=$('toast'); t.textContent=msg; t.className='toast'; clearTimeout(toast._t); toast._t=setTimeout(function(){ t.className='toast hide'; },3500); }
function openSheet(id){ SEL=id; OPEN_PANEL=null; try{history.pushState({s:1},'');}catch(e){} render(); var sh=$('sheet'); if(sh) sh.scrollTop=0; }
function closeSheet(){ if(history.state && history.state.s){ history.back(); } else { SEL=null; OPEN_PANEL=null; render(); } }
window.addEventListener('popstate',function(){ SEL=null; OPEN_PANEL=null; if(DATA) render(); });

function icon(kind){
  if(kind==='done') return '<svg class="i-done" viewBox="0 0 28 28"><circle cx="14" cy="14" r="13" fill="currentColor"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  if(kind==='pend') return '<svg class="i-pend" viewBox="0 0 28 28"><circle cx="14" cy="14" r="11.5" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>';
  return '<svg class="i-'+kind+'" viewBox="0 0 28 28"><circle cx="14" cy="14" r="11.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M14 2.5A11.5 11.5 0 0 0 14 25.5Z" fill="currentColor"/></svg>';
}

function estadoDe(k,dias,est){ if(k<0) return 'sin'; if(est==null||dias==null) return 'plazo'; if(dias>est) return 'demorado'; if(dias>=est-1) return 'porvencer'; return 'plazo'; }
function doSave(t,k,resp,notas,msg){
  if(BUSY) return;
  if(!getWho()){ askWho(function(){ doSave(t,k,resp,notas,msg); }); return; }
  BUSY=true;
  var before=JSON.parse(JSON.stringify(t));
  var nn=(typeof notas==='string')?notas:t.notas;
  var moved=(t.etapa!==k);
  // se muestra el cambio al instante; si el servidor falla, se vuelve atrás
  t.etapa=k; t.responsable=resp||''; t.notas=nn;
  if(moved){ t.dias=0; t.entro=''; }
  t.est=DATA.etapas[k].dias; t.estado=estadoDe(k,t.dias,t.est);
  OPEN_PANEL=null; render(); toast(msg||'Guardado ✓');
  call('setEtapa',PW,t.id,k,resp||'',nn,getWho()).then(function(r){
    BUSY=false;
    var nt=r&&r.trabajo;
    if(nt){ for(var i=0;i<DATA.trabajos.length;i++) if(String(DATA.trabajos[i].id)===String(nt.id)) DATA.trabajos[i]=nt; DATA_AT=Date.now(); saveData(); }
    else if(r&&r.trabajos){ setData(r); }
    render();
  }).catch(function(e){
    BUSY=false;
    for(var i=0;i<DATA.trabajos.length;i++) if(String(DATA.trabajos[i].id)===String(before.id)) DATA.trabajos[i]=before;
    if(isNetErr(e)){ OFFLINE=true; toast('Sin conexión: no se guardó. Probá de nuevo.'); } else toast((e&&e.message||'No se pudo guardar.').replace(/^Error: /,''));
    render();
  });
}
function startMove(t,k){
  var r=DATA.etapas[k].responsables;
  if(r.length>1){ OPEN_PANEL=k; renderDetail(); return; }
  doSave(t,k,r[0]||'',undefined, 'Pasó a «'+DATA.etapas[k].nombre+'» ✓');
}

function renderDetail(){
  var sh=$('sheet');
  var t = DATA.trabajos.filter(function(x){ return String(x.id)===String(SEL); })[0];
  if(!t){ sh.className='sheet hide'; sh.innerHTML=''; return; }
  var keep = sh.scrollTop;
  sh.className='sheet';
  var E = DATA.etapas, cur=t.etapa;
  var kindNow = t.estado==='demorado' ? 'late' : t.estado==='porvencer' ? 'por' : 'now';
  var late = t.estado==='demorado' ? '<span class="tag t-demorado">Demorado: '+(t.dias-t.est)+' día(s) de más</span>' : t.estado==='porvencer' ? '<span class="tag t-porvencer">Por vencer</span>' : t.estado==='sin' ? '<span class="tag t-sin">Sin etapa</span>' : '<span class="tag t-plazo">En plazo</span>';
  var html = '<div class="wrap"><button class="back" id="bk">← Trabajos</button>'
    +'<div style="margin:0.5rem 0 0.125rem;font-size:1.625rem;font-weight:700">'+esc(t.cliente)+'</div>'
    +'<div class="sub">'+esc(t.zona)+(t.zona?' · ':'')+'cargado el '+esc(t.fecha)+'</div><div style="margin-top:0.5rem">'+late+'</div>'
    +'<div class="steps">';
  E.forEach(function(e,k){
    var kind = cur<0 ? 'pend' : k<cur ? 'done' : k===cur ? kindNow : 'pend';
    var meta='';
    if(k===cur){ meta = (t.responsable?esc(t.responsable)+' · ':'')+(t.dias!=null?t.dias+' d'+(t.est!=null?' de '+t.est:''):''); }
    html += '<div class="step'+(k===cur?' cur':'')+'" data-k="'+k+'">'+icon(kind)+'<div><div class="tt">'+esc(e.nombre)+'</div>'+(meta?'<div class="meta">'+meta+'</div>':'')+'</div></div>';
    if(OPEN_PANEL===k){
      html += '<div class="panel"><div class="sub">¿Quién lo tiene en «'+esc(e.nombre)+'»?</div><div class="pchips">'+e.responsables.map(function(x){ return '<button class="pchip pri" data-resp="'+esc(x)+'">'+esc(x)+'</button>'; }).join('')+'</div></div>';
    }
  });
  html += '</div>';
  if(cur>=0 && E[cur].responsables.length>1){
    html += '<div class="sub" style="margin-top:0.375rem">Cambiar quién lo tiene:</div><div class="pchips">'+E[cur].responsables.map(function(x){ return '<button class="pchip'+(x===t.responsable?' pri':'')+'" data-same="'+esc(x)+'">'+esc(x)+'</button>'; }).join('')+'</div>';
  }
  html += '<details style="margin-top:0.875rem"'+(t.notas?' open':'')+'><summary>Notas</summary><textarea id="sNo" rows="3" placeholder="Escribí una nota..."'+(cur<0?' disabled':'')+'>'+esc(t.notas)+'</textarea>'
    +(cur<0?'<div class="sub">Asigná el primer paso para poder escribir notas.</div>':'<div style="height:0.5rem"></div><button id="saveNote">Guardar nota</button>')+'</details>'
    +'<div class="err" id="derr"></div></div>';
  var next = cur<0 ? 0 : cur+1;
  var bar = '<div class="bar-fix"><div class="in">';
  if(next<E.length){
    bar += '<button class="pri big" id="nextBtn">'+(cur<0?'Empezar: ':'Siguiente paso: ')+esc(E[next].nombre)+' →</button>';
  } else {
    bar += '<div style="text-align:center;font-weight:600;padding:0.75rem;color:var(--ok)">✓ Trabajo completo</div>';
  }
  if(cur>0) bar += '<div style="text-align:center"><button class="sec" id="prevBtn">↩ Volver a «'+esc(E[cur-1].nombre)+'»</button></div>';
  bar += '</div></div>';
  sh.innerHTML = html + bar;
  sh.scrollTop = keep;

  $('bk').onclick=closeSheet;
  Array.prototype.forEach.call(sh.querySelectorAll('.step'),function(el){ el.onclick=function(){ var k=+el.getAttribute('data-k'); if(k===cur) return; if(BUSY) return; if(confirm('¿Mover «'+t.cliente+'» a «'+E[k].nombre+'»?')) startMove(t,k); }; });
  Array.prototype.forEach.call(sh.querySelectorAll('[data-resp]'),function(b){ b.onclick=function(){ doSave(t,OPEN_PANEL,b.getAttribute('data-resp'),undefined, 'Pasó a «'+E[OPEN_PANEL].nombre+'» ✓'); }; });
  Array.prototype.forEach.call(sh.querySelectorAll('[data-same]'),function(b){ b.onclick=function(){ doSave(t,cur,b.getAttribute('data-same'),undefined, 'Ahora lo tiene '+b.getAttribute('data-same')+' ✓'); }; });
  if($('nextBtn')) $('nextBtn').onclick=function(){ startMove(t,next); };
  if($('prevBtn')) $('prevBtn').onclick=function(){ if(confirm('¿Volver «'+t.cliente+'» a «'+E[cur-1].nombre+'»?')) startMove(t,cur-1); };
  if($('saveNote')) $('saveNote').onclick=function(){ doSave(t,cur,t.responsable,$('sNo').value,'Nota guardada ✓'); };
}


// ---------- Dictado por voz: "Laura está en plegadora con Silvio" ----------
var REC=null, VS=null;
function norm(x){ return String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9% ]/g,' ').replace(/\s+/g,' ').trim(); }
function stageIndex(words){
  var rules=[[/postventa|post venta/,'postventa'],[/instalado|100|cien por/,'instalado'],[/listo/,'listo'],[/terminac/,'terminacion'],[/pintur/,'pintura'],[/herrer/,'herreria'],[/plegad|plegador/,'plegadora'],[/50|cincuenta|sena|abonad/,'50']];
  for(var i=0;i<rules.length;i++){ if(rules[i][0].test(words)){ var key=rules[i][1];
    for(var k=0;k<DATA.etapas.length;k++){ if(norm(DATA.etapas[k].nombre).indexOf(key)>=0) return k; } } }
  return -1;
}
function jobCandidates(words){
  var ws=words.split(' '), out=[];
  DATA.trabajos.forEach(function(t){
    var c=norm(t.cliente); if(!c) return;
    var full = (' '+words+' ').indexOf(' '+c+' ')>=0;
    var first = c.split(' ')[0]; var part = first.length>=3 && ws.indexOf(first)>=0;
    if(full||part) out.push({t:t,score:full?2:1});
  });
  var best=0; out.forEach(function(o){ if(o.score>best) best=o.score; });
  return out.filter(function(o){return o.score===best;}).map(function(o){return o.t;});
}
function respFor(k,words){
  var rs=DATA.etapas[k].responsables, ws=' '+words+' ';
  for(var i=0;i<rs.length;i++){ var parts=norm(rs[i]).split(' ').filter(function(w){return w.length>=3 && w!=='lo' && w!=='los';}); 
    for(var j=0;j<parts.length;j++){ if(ws.indexOf(' '+parts[j]+' ')>=0) return rs[i]; } }
  return null;
}
function vclose(){ $('voiceBox').className='modal hide'; VS=null; }
function vshow(){
  var h='<h1>🎤 Entendí</h1><div class="vsay">«'+esc(VS.said)+'»</div>';
  var btns=function(arr,attr){ return arr.map(function(a,i){ return '<button class="vopt" '+attr+'="'+i+'">'+esc(a)+'</button>'; }).join(''); };
  if(!VS.job){
    if(VS.cands.length>1){ h+='<p>¿De cuál trabajo hablás?</p>'+btns(VS.cands.map(function(t){return t.cliente+(t.zona?' · '+t.zona:'');}),'data-vj'); }
    else { h+='<p>No encontré ese cliente. Probá decir el nombre y el paso, por ejemplo: «Laura está en plegadora con Silvio».</p>'; }
  } else if(VS.k<0){
    h+='<div class="vres">'+esc(VS.job.cliente)+'</div><p>¿En qué paso está?</p>'+btns(DATA.etapas.map(function(e){return e.nombre;}),'data-vk');
  } else if(VS.resp===null){
    h+='<div class="vres">'+esc(VS.job.cliente)+' → '+esc(DATA.etapas[VS.k].nombre)+'</div><p>¿Quién lo tiene?</p>'+btns(DATA.etapas[VS.k].responsables,'data-vr');
  } else {
    h+='<div class="vres">'+esc(VS.job.cliente)+' → '+esc(DATA.etapas[VS.k].nombre)+(VS.resp?' · '+esc(VS.resp):'')+'</div><button class="pri big" id="vok">Confirmar</button>';
  }
  h+='<button id="vretry">🎤 Volver a hablar</button><button class="sec" id="vno">Cancelar</button>';
  $('voiceIn').innerHTML=h; $('voiceBox').className='modal';
  Array.prototype.forEach.call($('voiceIn').querySelectorAll('[data-vj]'),function(b){ b.onclick=function(){ VS.job=VS.cands[+b.getAttribute('data-vj')]; if(VS.k>=0){ var rs=DATA.etapas[VS.k].responsables; VS.resp = respFor(VS.k,VS.words) || (rs.length<=1?(rs[0]||''):null); } vshow(); }; });
  Array.prototype.forEach.call($('voiceIn').querySelectorAll('[data-vk]'),function(b){ b.onclick=function(){ VS.k=+b.getAttribute('data-vk'); var rs=DATA.etapas[VS.k].responsables; VS.resp = respFor(VS.k,VS.words) || (rs.length<=1?(rs[0]||''):null); vshow(); }; });
  Array.prototype.forEach.call($('voiceIn').querySelectorAll('[data-vr]'),function(b){ b.onclick=function(){ VS.resp=DATA.etapas[VS.k].responsables[+b.getAttribute('data-vr')]; vshow(); }; });
  if($('vok')) $('vok').onclick=function(){ var j=VS.job,k=VS.k,r=VS.resp; vclose(); doSave(j,k,r,undefined,'Listo: '+j.cliente+' → '+DATA.etapas[k].nombre+' ✓'); };
  $('vretry').onclick=function(){ vclose(); startVoice(); };
  $('vno').onclick=vclose;
}
function handleSpeech(text){
  var words=norm(text); var cands=jobCandidates(words);
  var k=stageIndex(words);
  VS={said:text,words:words,cands:cands,job:cands.length===1?cands[0]:null,k:k,resp:null};
  if(VS.k>=0){ var rs=DATA.etapas[k].responsables; VS.resp = respFor(k,words) || (rs.length<=1?(rs[0]||''):null); }
  vshow();
}
function startVoice(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('Este navegador no permite dictado por voz.'); return; }
  if(REC){ try{REC.stop();}catch(e){} return; }
  var r=new SR(); r.lang='es-AR'; r.interimResults=false; r.maxAlternatives=1; r.continuous=false;
  var got=''; REC=r; render();
  r.onresult=function(ev){ got=ev.results[0][0].transcript; };
  r.onerror=function(ev){ REC=null; render(); toast(ev.error==='not-allowed'?'Permití el micrófono para usar el dictado.':ev.error==='no-speech'?'No te escuché. Probá de nuevo.':'No se pudo escuchar ('+ev.error+').'); };
  r.onend=function(){ REC=null; render(); if(got) handleSpeech(got); };
  try{ r.start(); toast('Escuchando… decí por ejemplo: «Laura está en plegadora con Silvio»'); }catch(e){ REC=null; render(); }
}
$('mic').onclick=function(){ startVoice(); };

var VERSION='8';
if('serviceWorker' in navigator){
  var hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(function(){});
  // cuando se instala una versión nueva, se recarga sola (una vez) para mostrarla
  navigator.serviceWorker.addEventListener('controllerchange',function(){ if(hadSW && !window.__rl){ window.__rl=1; location.reload(); } });
}
(function init(){
  var p = savedPw();
  var c = p ? savedData() : null;
  if(p && c){
    // abre al instante con lo último guardado y se actualiza por detrás
    PW=p; DATA=c.d; DATA_AT=c.t||0; $('login').className='hide'; $('app').className=''; render();
    call('getData',p).then(function(d){ setData(d); render(); }).catch(function(e){
      if(isNetErr(e)){ OFFLINE=true; netBanner(); } else { clearPw(); clearData(); PW=null; DATA=null; SEL=null; $('sheet').className='sheet hide'; showLogin('La clave cambió. Ingresala de nuevo.'); }
    });
  } else if(p) tryLogin(p); else showLogin('');
  setInterval(function(){ if(PW && !BUSY && !SEL && !document.hidden) reload(); }, 60000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden && PW && !BUSY) reload(); });
})();

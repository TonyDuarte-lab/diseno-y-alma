<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#185fa5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Diseño y Alma - Trabajos</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1f1f1d;--tx2:#5f5e5a;--bd:#e1dfd8;--ac:#185fa5;--acbg:#e6f1fb;--ok:#3b6d11;--okbg:#eaf3de;--wa:#854f0b;--wabg:#faeeda;--rd:#a32d2d;--rdbg:#fcebeb;}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b19;--card:#262624;--tx:#f1efe8;--tx2:#b4b2a9;--bd:#3a3a37;--ac:#85b7eb;--acbg:#0c447c;--ok:#c0dd97;--okbg:#27500a;--wa:#fac775;--wabg:#633806;--rd:#f7c1c1;--rdbg:#791f1f;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;width:100%;overflow-x:hidden}
body{margin:0;width:100%;min-height:100vh;min-height:100dvh;overflow-x:hidden;overscroll-behavior-y:contain;touch-action:manipulation;background:var(--bg);color:var(--tx);font:16px/1.5 Arial,Helvetica,sans-serif}
.wrap{width:100%;margin:0 auto;padding:16px;padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right));padding-top:calc(16px + env(safe-area-inset-top))}
@media (min-width:700px){.wrap{max-width:640px}}
h1{font-size:20px;font-weight:600;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card.sel{border-color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nm{font-weight:600}
.sub{font-size:13px;color:var(--tx2)}
.tag{font-size:12px;padding:2px 8px;border-radius:8px;white-space:nowrap}
.t-sin{background:var(--bd);color:var(--tx2)}.t-plazo{background:var(--okbg);color:var(--ok)}.t-porvencer{background:var(--wabg);color:var(--wa)}.t-demorado{background:var(--rdbg);color:var(--rd)}
.bar{height:6px;border-radius:3px;background:var(--bd);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%}
.f-plazo{background:var(--ok)}.f-porvencer{background:var(--wa)}.f-demorado{background:var(--rd)}.f-sin{background:var(--bd)}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;width:100%}
button{cursor:pointer;font-weight:600}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
@media (prefers-color-scheme:dark){button.pri{color:#04202e}}
button.link{width:auto;border:none;background:none;color:var(--tx2);font-weight:400;padding:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{width:auto;padding:5px 12px;font-size:13px;font-weight:400;border-radius:16px}
.chip.on{background:var(--acbg);color:var(--ac);border-color:var(--ac)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet .wrap{padding-bottom:140px}
.back{width:auto;border:none;background:none;font-size:15px;color:var(--ac);padding:6px 4px;font-weight:600}
.steps{margin:14px 0 6px}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-radius:10px;cursor:pointer;position:relative}
.step:active{background:var(--acbg)}
.step svg{flex:none;width:28px;height:28px}
.step .tt{font-size:16px;line-height:28px}
.step.cur .tt{font-weight:700}
.step .meta{font-size:13px;color:var(--tx2);margin-top:-2px}
.i-done{color:var(--ok)}.i-now{color:var(--ac)}.i-por{color:var(--wa)}.i-late{color:var(--rd)}.i-pend{color:var(--tx2);opacity:.55}
.panel{margin:4px 0 8px 40px;padding:10px;border:1px dashed var(--bd);border-radius:10px}
.pchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pchip{width:auto;padding:10px 18px;border-radius:20px}
.bar-fix{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:11}
.bar-fix .in{max-width:640px;margin:0 auto}
button.big{padding:14px 12px;font-size:17px;border-radius:12px}
button.sec{background:none;border:none;color:var(--tx2);font-weight:400;padding:8px;width:auto}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;z-index:20;max-width:90%}
details summary{cursor:pointer;color:var(--tx2);font-size:14px;padding:6px 0}
.err{color:var(--rd);font-size:14px;margin-top:8px;min-height:20px}
label{font-size:13px;color:var(--tx2);display:block;margin:10px 0 4px}
.hide{display:none!important}
.net{background:var(--wabg);color:var(--wa);font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:10px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--bg);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.modal button{margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<div id="login" class="hide">
  <img src="logo-96.png" alt="Diseño y Alma" width="72" height="72" style="border-radius:16px;display:block;margin-bottom:8px">
  <h1>Diseño y Alma</h1>
  <p class="sub">Ingresá la clave para ver los trabajos.</p>
  <input id="pw" type="password" placeholder="Clave" autocomplete="current-password">
  <div style="height:10px"></div>
  <button class="pri" id="go">Entrar</button>
  <div class="err" id="lerr"></div>
</div>

<div id="app" class="hide">
  <div class="top"><div class="row" style="justify-content:flex-start"><img src="logo-96.png" alt="" width="36" height="36" style="border-radius:8px"><h1>Trabajos</h1></div><div><button class="link" id="who">👤</button><button class="link" id="ref">Actualizar</button><button class="link" id="out">Salir</button></div></div>
  <div id="net" class="net hide"></div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <div class="sub" style="text-align:center;margin-top:8px" id="upd"></div>
</div>
</div>
<div id="sheet" class="sheet hide"></div>
<div id="toast" class="toast hide"></div>
<div id="whoBox" class="modal hide"><div class="box"><h1>¿Quién sos?</h1><p class="sub">Así queda anotado en el historial quién hizo cada cambio.</p><button class="pri big" data-w="Tony">Tony</button><button class="big" data-w="Leo">Leo</button><button class="big" data-w="Otro">Otro</button></div></div>

<script>
var PW = null, DATA = null, FILTER = 'todos', SEL = null, BUSY = false, OFFLINE = false, DATA_AT = 0;
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var API = 'https://script.google.com/macros/s/AKfycbwYpCU2lYRbm9Mq5fC9nO1_VX4zbjNfzE9gpa5spVY31L10GXhmkrm7ZNmpcEhlHtq2GA/exec';
function call(fn){
  var args = Array.prototype.slice.call(arguments,1);
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),credentials:'omit',redirect:'follow'})
    .then(function(r){return r.json();})
    .then(function(j){ if(j.error) throw new Error(j.error); return j.data; });
}
function savedPw(){try{return localStorage.getItem('dya_pw');}catch(e){return null;}}
function savedData(){try{var j=JSON.parse(localStorage.getItem('dya_data')||'null'); return (j&&j.d&&j.d.trabajos)?j:null;}catch(e){return null;}}
function saveData(){try{localStorage.setItem('dya_data',JSON.stringify({d:DATA,t:DATA_AT}));}catch(e){}}
function clearData(){try{localStorage.removeItem('dya_data');}catch(e){}}
function getWho(){try{return localStorage.getItem('dya_who')||'';}catch(e){return '';}}
function setWho(w){try{localStorage.setItem('dya_who',w);}catch(e){}}
function ago(ms){var m=Math.round((Date.now()-ms)/60000); if(m<1) return 'recién'; if(m<60) return 'hace '+m+' min'; var h=Math.round(m/60); if(h<24) return 'hace '+h+' h'; return 'hace '+Math.round(h/24)+' d';}
function netBanner(){var n=$('net'); if(OFFLINE){ n.textContent='Sin conexión · mostrando datos de '+ago(DATA_AT)+'. Los cambios no se guardan hasta que vuelva internet.'; n.className='net'; } else { n.className='net hide'; }}
function isNetErr(e){ return e && (e.name==='TypeError' || /Failed to fetch|NetworkError|Load failed/i.test(e.message||'')); }
function setData(d){ DATA=d; DATA_AT=Date.now(); OFFLINE=false; saveData(); }
function savePw(p){try{localStorage.setItem('dya_pw',p);}catch(e){}}
function clearPw(){try{localStorage.removeItem('dya_pw');}catch(e){}}

function showLogin(msg){ $('app').className='hide'; $('login').className=''; $('lerr').textContent=msg||''; }
function tryLogin(p){
  return call('getData',p).then(function(d){ PW=p; savePw(p); setData(d); $('login').className='hide'; $('app').className=''; render(); })
  .catch(function(e){ if(isNetErr(e)){ $('lerr').textContent='Sin conexión. Probá de nuevo cuando tengas internet.'; return; } clearPw(); clearData(); showLogin((e && e.message || 'No se pudo entrar.').replace(/^Error: /,'')); });
}
$('go').onclick=function(){ var p=$('pw').value; if(!p){$('lerr').textContent='Ingresá la clave.';return;} $('lerr').textContent=''; tryLogin(p); };
$('pw').onkeydown=function(e){ if(e.key==='Enter') $('go').click(); };
$('out').onclick=function(){ clearPw(); clearData(); PW=null; DATA=null; SEL=null; $('sheet').className='sheet hide'; showLogin(''); };
$('ref').onclick=function(){ reload(true); };
$('who').onclick=function(){ askWho(); };
Array.prototype.forEach.call(document.querySelectorAll('#whoBox [data-w]'),function(b){ b.onclick=function(){ setWho(b.getAttribute('data-w')); $('whoBox').className='modal hide'; showWho(); if(WHO_CB){ var f=WHO_CB; WHO_CB=null; f(); } }; });
var WHO_CB=null;
function askWho(cb){ WHO_CB=cb||null; $('whoBox').className='modal'; }
function showWho(){ var w=getWho(); $('who').textContent='👤 '+(w||'¿Quién?'); }
window.addEventListener('online',function(){ reload(); });
window.addEventListener('offline',function(){ OFFLINE=true; netBanner(); });

function reload(force){
  if(!PW) return;
  if(force) $('upd').textContent='Actualizando...';
  call('getData',PW,!!force).then(function(d){ setData(d); render(); }).catch(function(e){ if(isNetErr(e)){ OFFLINE=true; netBanner(); } else if(force){ $('upd').textContent='No se pudo actualizar.'; } });
}

var ORDER={demorado:0,porvencer:1,plazo:2,sin:3};
function render(){
  var T = DATA.trabajos.slice().sort(function(a,b){ return (ORDER[a.estado]-ORDER[b.estado]) || (b.dias||0)-(a.dias||0); });
  var counts={todos:T.length,demorado:0,porvencer:0,sin:0};
  T.forEach(function(t){ if(counts[t.estado]!==undefined) counts[t.estado]++; });
  var defs=[['todos','Todos'],['demorado','Demorados'],['porvencer','Por vencer'],['sin','Sin etapa']];
  $('chips').innerHTML = defs.map(function(d){ return '<button class="chip'+(FILTER===d[0]?' on':'')+'" data-f="'+d[0]+'">'+d[1]+' '+(counts[d[0]]||0)+'</button>'; }).join('');
  Array.prototype.forEach.call($('chips').children,function(b){ b.onclick=function(){ FILTER=b.getAttribute('data-f'); render(); }; });
  var L = T.filter(function(t){ return FILTER==='todos' || t.estado===FILTER; });
  var n = DATA.etapas.length;
  $('list').innerHTML = L.map(function(t){
    var tag = t.estado==='demorado' ? 'Demorado' : t.estado==='porvencer' ? 'Por vencer' : t.estado==='sin' ? 'Sin etapa' : 'En plazo';
    var et = t.etapa>=0 ? DATA.etapas[t.etapa].nombre : 'Etapa por asignar';
    var pc = t.etapa>=0 ? Math.round((t.etapa+1)/n*100) : 0;
    var info = t.etapa>=0 ? 'Paso '+(t.etapa+1)+' de '+n+(t.dias!=null ? ' · '+t.dias+' d'+(t.est!=null?' de '+t.est:'') : '') : '';
    return '<div class="card'+(SEL===t.id?' sel':'')+'" data-id="'+esc(t.id)+'"><div class="row"><span class="nm">'+esc(t.cliente)+'</span><span class="tag t-'+t.estado+'">'+tag+'</span></div>'
      +'<div class="sub">'+esc(et)+(t.responsable?' · '+esc(t.responsable):'')+(t.zona?' · '+esc(t.zona):'')+'</div>'
      +(t.etapa>=0?'<div class="row sub" style="margin-top:4px"><span>'+info+'</span><span></span></div>':'')
      +'<div class="bar"><i class="f-'+t.estado+'" style="width:'+pc+'%"></i></div></div>';
  }).join('') || '<div class="sub">No hay trabajos para mostrar.</div>';
  Array.prototype.forEach.call($('list').querySelectorAll('.card'),function(c){ c.onclick=function(){ openSheet(c.getAttribute('data-id')); }; });
  renderDetail();
  var now=new Date(DATA_AT||Date.now()); $('upd').textContent='Actualizado '+now.getHours()+':'+('0'+now.getMinutes()).slice(-2);
  netBanner(); showWho();
}

var OPEN_PANEL = null;
function toast(msg){ var t=$('toast'); t.textContent=msg; t.className='toast'; clearTimeout(toast._t); toast._t=setTimeout(function(){ t.className='toast hide'; },3500); }
function openSheet(id){ SEL=id; OPEN_PANEL=null; try{history.pushState({s:1},'');}catch(e){} render(); var sh=$('sheet'); if(sh) sh.scrollTop=0; }
function closeSheet(){ if(history.state && history.state.s){ history.back(); } else { SEL=null; OPEN_PANEL=null; render(); } }
window.addEventListener('popstate',function(){ SEL=null; OPEN_PANEL=null; if(DATA) render(); });

function icon(kind){
  if(kind==='done') return '<svg class="i-done" viewBox="0 0 28 28"><circle cx="14" cy="14" r="13" fill="currentColor"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  if(kind==='pend') return '<svg class="i-pend" viewBox="0 0 28 28"><circle cx="14" cy="14" r="11.5" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>';
  return '<svg class="i-'+kind+'" viewBox="0 0 28 28"><circle cx="14" cy="14" r="11.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M14 2.5A11.5 11.5 0 0 0 14 25.5Z" fill="currentColor"/></svg>';
}

function estadoDe(k,dias,est){ if(k<0) return 'sin'; if(est==null||dias==null) return 'plazo'; if(dias>est) return 'demorado'; if(dias>=est-1) return 'porvencer'; return 'plazo'; }
function doSave(t,k,resp,notas,msg){
  if(BUSY) return;
  if(!getWho()){ askWho(function(){ doSave(t,k,resp,notas,msg); }); return; }
  BUSY=true;
  var before=JSON.parse(JSON.stringify(t));
  var nn=(typeof notas==='string')?notas:t.notas;
  var moved=(t.etapa!==k);
  // se muestra el cambio al instante; si el servidor falla, se vuelve atrás
  t.etapa=k; t.responsable=resp||''; t.notas=nn;
  if(moved){ t.dias=0; t.entro=''; }
  t.est=DATA.etapas[k].dias; t.estado=estadoDe(k,t.dias,t.est);
  OPEN_PANEL=null; render(); toast(msg||'Guardado ✓');
  call('setEtapa',PW,t.id,k,resp||'',nn,getWho()).then(function(r){
    BUSY=false;
    var nt=r&&r.trabajo;
    if(nt){ for(var i=0;i<DATA.trabajos.length;i++) if(String(DATA.trabajos[i].id)===String(nt.id)) DATA.trabajos[i]=nt; DATA_AT=Date.now(); saveData(); }
    else if(r&&r.trabajos){ setData(r); }
    render();
  }).catch(function(e){
    BUSY=false;
    for(var i=0;i<DATA.trabajos.length;i++) if(String(DATA.trabajos[i].id)===String(before.id)) DATA.trabajos[i]=before;
    if(isNetErr(e)){ OFFLINE=true; toast('Sin conexión: no se guardó. Probá de nuevo.'); } else toast((e&&e.message||'No se pudo guardar.').replace(/^Error: /,''));
    render();
  });
}
function startMove(t,k){
  var r=DATA.etapas[k].responsables;
  if(r.length>1){ OPEN_PANEL=k; renderDetail(); return; }
  doSave(t,k,r[0]||'',undefined, 'Pasó a «'+DATA.etapas[k].nombre+'» ✓');
}

function renderDetail(){
  var sh=$('sheet');
  var t = DATA.trabajos.filter(function(x){ return String(x.id)===String(SEL); })[0];
  if(!t){ sh.className='sheet hide'; sh.innerHTML=''; return; }
  var keep = sh.scrollTop;
  sh.className='sheet';
  var E = DATA.etapas, cur=t.etapa;
  var kindNow = t.estado==='demorado' ? 'late' : t.estado==='porvencer' ? 'por' : 'now';
  var late = t.estado==='demorado' ? '<span class="tag t-demorado">Demorado: '+(t.dias-t.est)+' día(s) de más</span>' : t.estado==='porvencer' ? '<span class="tag t-porvencer">Por vencer</span>' : t.estado==='sin' ? '<span class="tag t-sin">Sin etapa</span>' : '<span class="tag t-plazo">En plazo</span>';
  var html = '<div class="wrap"><button class="back" id="bk">← Trabajos</button>'
    +'<div style="margin:8px 0 2px;font-size:22px;font-weight:700">'+esc(t.cliente)+'</div>'
    +'<div class="sub">'+esc(t.zona)+(t.zona?' · ':'')+'cargado el '+esc(t.fecha)+'</div><div style="margin-top:8px">'+late+'</div>'
    +'<div class="steps">';
  E.forEach(function(e,k){
    var kind = cur<0 ? 'pend' : k<cur ? 'done' : k===cur ? kindNow : 'pend';
    var meta='';
    if(k===cur){ meta = (t.responsable?esc(t.responsable)+' · ':'')+(t.dias!=null?t.dias+' d'+(t.est!=null?' de '+t.est:''):''); }
    html += '<div class="step'+(k===cur?' cur':'')+'" data-k="'+k+'">'+icon(kind)+'<div><div class="tt">'+esc(e.nombre)+'</div>'+(meta?'<div class="meta">'+meta+'</div>':'')+'</div></div>';
    if(OPEN_PANEL===k){
      html += '<div class="panel"><div class="sub">¿Quién lo tiene en «'+esc(e.nombre)+'»?</div><div class="pchips">'+e.responsables.map(function(x){ return '<button class="pchip pri" data-resp="'+esc(x)+'">'+esc(x)+'</button>'; }).join('')+'</div></div>';
    }
  });
  html += '</div>';
  if(cur>=0 && E[cur].responsables.length>1){
    html += '<div class="sub" style="margin-top:6px">Cambiar quién lo tiene:</div><div class="pchips">'+E[cur].responsables.map(function(x){ return '<button class="pchip'+(x===t.responsable?' pri':'')+'" data-same="'+esc(x)+'">'+esc(x)+'</button>'; }).join('')+'</div>';
  }
  html += '<details style="margin-top:14px"'+(t.notas?' open':'')+'><summary>Notas</summary><textarea id="sNo" rows="3" placeholder="Escribí una nota..."'+(cur<0?' disabled':'')+'>'+esc(t.notas)+'</textarea>'
    +(cur<0?'<div class="sub">Asigná el primer paso para poder escribir notas.</div>':'<div style="height:8px"></div><button id="saveNote">Guardar nota</button>')+'</details>'
    +'<div class="err" id="derr"></div></div>';
  var next = cur<0 ? 0 : cur+1;
  var bar = '<div class="bar-fix"><div class="in">';
  if(next<E.length){
    bar += '<button class="pri big" id="nextBtn">'+(cur<0?'Empezar: ':'Siguiente paso: ')+esc(E[next].nombre)+' →</button>';
  } else {
    bar += '<div style="text-align:center;font-weight:600;padding:12px;color:var(--ok)">✓ Trabajo completo</div>';
  }
  if(cur>0) bar += '<div style="text-align:center"><button class="sec" id="prevBtn">↩ Volver a «'+esc(E[cur-1].nombre)+'»</button></div>';
  bar += '</div></div>';
  sh.innerHTML = html + bar;
  sh.scrollTop = keep;

  $('bk').onclick=closeSheet;
  Array.prototype.forEach.call(sh.querySelectorAll('.step'),function(el){ el.onclick=function(){ var k=+el.getAttribute('data-k'); if(k===cur) return; if(BUSY) return; if(confirm('¿Mover «'+t.cliente+'» a «'+E[k].nombre+'»?')) startMove(t,k); }; });
  Array.prototype.forEach.call(sh.querySelectorAll('[data-resp]'),function(b){ b.onclick=function(){ doSave(t,OPEN_PANEL,b.getAttribute('data-resp'),undefined, 'Pasó a «'+E[OPEN_PANEL].nombre+'» ✓'); }; });
  Array.prototype.forEach.call(sh.querySelectorAll('[data-same]'),function(b){ b.onclick=function(){ doSave(t,cur,b.getAttribute('data-same'),undefined, 'Ahora lo tiene '+b.getAttribute('data-same')+' ✓'); }; });
  if($('nextBtn')) $('nextBtn').onclick=function(){ startMove(t,next); };
  if($('prevBtn')) $('prevBtn').onclick=function(){ if(confirm('¿Volver «'+t.cliente+'» a «'+E[cur-1].nombre+'»?')) startMove(t,cur-1); };
  if($('saveNote')) $('saveNote').onclick=function(){ doSave(t,cur,t.responsable,$('sNo').value,'Nota guardada ✓'); };
}

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
(function init(){
  var p = savedPw();
  var c = p ? savedData() : null;
  if(p && c){
    // abre al instante con lo último guardado y se actualiza por detrás
    PW=p; DATA=c.d; DATA_AT=c.t||0; $('login').className='hide'; $('app').className=''; render();
    call('getData',p).then(function(d){ setData(d); render(); }).catch(function(e){
      if(isNetErr(e)){ OFFLINE=true; netBanner(); } else { clearPw(); clearData(); PW=null; DATA=null; SEL=null; $('sheet').className='sheet hide'; showLogin('La clave cambió. Ingresala de nuevo.'); }
    });
  } else if(p) tryLogin(p); else showLogin('');
  setInterval(function(){ if(PW && !BUSY && !SEL && !document.hidden) reload(); }, 60000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden && PW && !BUSY) reload(); });
})();
</script>
</body>
</html>
